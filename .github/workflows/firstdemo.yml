
name: My First GitHub Action

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print first message
        run: echo "Hello GitHub Actions"

      - name: Print second message
        run: echo "My first CI/CD pipeline"

      - name: Check current directory
        run: pwd

      - name: List files
        run: ls -la
